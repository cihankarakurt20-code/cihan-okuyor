<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cihan Okuyor</title>

<!-- Telefon / ana ekran uygulaması ayarları -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cihan Okuyor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>
  :root {
    --bg: #faf9f6;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #8a8780;
    --line: #e8e5de;
    --accent: #1f1f1f;
    --on-accent: #faf9f6;
    --dot-off-sel: rgba(255,255,255,.28);

    --red: #d14b4b;    --red-bg: #fbeeee;
    --yellow: #c99a06; --yellow-bg: #fdf6dc;
    --green: #2e9459;  --green-bg: #e7f5ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513;
      --card: #1e1e1b;
      --text: #ecebe6;
      --muted: #8d8b84;
      --line: #2f2e2a;
      --accent: #ecebe6;
      --on-accent: #151513;
      --dot-off-sel: rgba(0,0,0,.22);

      --red: #e06666;    --red-bg: #352121;
      --yellow: #e5bb3a; --yellow-bg: #35301a;
      --green: #4cb878;  --green-bg: #1c3125;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:active { opacity: .75; }

  /* ---------- Üst kısım (sabit) ---------- */
  .top-wrap {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding-top: env(safe-area-inset-top);
    border-bottom: 1px solid var(--line);
  }
  .inner { max-width: 560px; margin: 0 auto; }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 8px 0 16px;
  }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 23px; letter-spacing: -.3px; }
  .top-right { display: flex; align-items: center; }
  .yearnav { display: flex; align-items: center; }
  .yearnav span { font-weight: 600; font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
  .icon-btn {
    width: 40px; height: 40px; border: none; background: none;
    border-radius: 50%; font-size: 22px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .yearsum {
    display: flex; align-items: center; gap: 12px;
    padding: 4px 16px 0; font-size: 13px; color: var(--muted);
  }
  .yearsum b { color: var(--text); font-weight: 600; }
  .bar { flex: 1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--green); transition: width .3s; }

  .months {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 12px 16px 12px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .months::-webkit-scrollbar { display: none; }
  .mchip {
    flex: 0 0 auto; width: 54px; padding: 8px 0 8px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--card);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 13.5px;
  }
  .mchip.now { border-color: var(--muted); font-weight: 600; }
  .mchip.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .mchip.sel .dots i { background: var(--dot-off-sel); }
  .dots i.on, .mchip.sel .dots i.on { background: var(--green); }

  /* ---------- Ay ekranı ---------- */
  main {
    max-width: 560px; margin: 0 auto;
    padding: 22px 16px calc(110px + env(safe-area-inset-bottom));
    min-height: 70vh;
  }
  .m-title { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  .m-title h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 34px; line-height: 1.1; margin: 0; }
  .m-title h1 small { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; color: var(--muted); margin-left: 6px; }
  .goal { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding-bottom: 4px; }
  .goal .dots i { width: 8px; height: 8px; }
  .goal.ok { color: var(--green); font-weight: 600; }

  .books { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .book { border-radius: 16px; padding: 12px 12px 12px 16px; border-left: 4px solid; }
  .s-unread  { background: var(--red-bg);    border-color: var(--red); }
  .s-reading { background: var(--yellow-bg); border-color: var(--yellow); }
  .s-done    { background: var(--green-bg);  border-color: var(--green); }

  .b-top { display: flex; gap: 8px; align-items: flex-start; }
  .b-info { flex: 1; min-width: 0; padding-top: 2px; }
  .b-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .s-unread .b-label  { color: var(--red); }
  .s-reading .b-label { color: var(--yellow); }
  .s-done .b-label    { color: var(--green); }
  .b-title { font-size: 17px; font-weight: 600; margin-top: 2px; word-break: break-word; }
  .b-author { font-size: 14px; color: var(--muted); }
  .more { width: 36px; height: 36px; border: none; background: none; border-radius: 50%; font-size: 20px; color: var(--muted); flex: 0 0 auto; }

  .b-actions { display: flex; gap: 8px; margin-top: 12px; }
  .b-actions button {
    flex: 1; height: 44px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card);
    font-size: 15px; font-weight: 500;
  }
  .b-actions button[data-act="reading"].on { background: var(--yellow); border-color: var(--yellow); color: #fff; }
  .b-actions button[data-act="done"].on    { background: var(--green);  border-color: var(--green);  color: #fff; }
  @media (prefers-color-scheme: dark) {
    .b-actions button.on { color: #151513 !important; }
  }

  .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
  .empty .big { font-size: 36px; margin-bottom: 8px; }

  .fade { animation: fade .22s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- Alttaki ekle butonu ---------- */
  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
    padding: 18px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 65%, transparent);
  }
  .addbar button {
    display: block; width: 100%; max-width: 528px; margin: 0 auto;
    height: 54px; border-radius: 16px; border: none;
    background: var(--accent); color: var(--on-accent);
    font-size: 16px; font-weight: 600;
  }

  /* ---------- Alt sayfa (sheet) ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.35);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
    max-width: 560px; margin: 0 auto;
    background: var(--card); border-radius: 22px 22px 0 0;
    padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .25s ease;
  }
  .sheet.open { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 16px; }
  .sheet h3 { margin: 0 0 4px; font-size: 19px; }
  .sheet .hint { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  .sheet input {
    width: 100%; height: 50px; padding: 0 14px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    margin-bottom: 10px; outline: none; -webkit-appearance: none;
  }
  .sheet input:focus { border-color: var(--muted); }
  .sbtn {
    display: block; width: 100%; height: 52px; margin-top: 8px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    font-size: 16px; font-weight: 500;
  }
  .sbtn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .sbtn.danger { color: var(--red); }
  .sbtn.plain { border: none; color: var(--muted); }
  .note { text-align: center; color: var(--muted); font-size: 13px; margin: 14px 0 2px; }
</style>
</head>
<body>

<div class="top-wrap">
  <div class="inner">
    <div class="top">
      <div class="brand">Cihan Okuyor</div>
      <div class="top-right">
        <div class="yearnav">
          <button class="icon-btn" data-act="prevYear" aria-label="Önceki yıl">‹</button>
          <span id="yearLabel"></span>
          <button class="icon-btn" data-act="nextYear" aria-label="Sonraki yıl">›</button>
        </div>
        <button class="icon-btn" data-act="menu" aria-label="Menü">⋯</button>
      </div>
    </div>
    <div class="yearsum" id="yearsum"></div>
    <nav class="months" id="months"></nav>
  </div>
</div>

<main id="view"></main>

<div class="addbar"><button data-act="add">+ Kitap ekle</button></div>

<div class="backdrop" id="backdrop" data-act="close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
  const KEY = 'cihan-okuyor-v1';
  const HEDEF = 3;
  const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const KISA  = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const DURUM = { unread: 'Okunmadı', reading: 'Okunuyor', done: 'Okundu' };

  const now = new Date();
  const BU_YIL = now.getFullYear();
  const BU_AY = now.getMonth();

  let yil = BU_YIL;
  let ay = BU_AY;
  let seciliKitapId = null;

  // ---------- Veri ----------
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.years) return d;
    } catch (e) {}
    return { years: {} };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { alert('Kaydedilemedi. Tarayıcı depolaması kapalı olabilir.'); }
  }
  let data = load();

  function kitaplar(y, m, olustur) {
    if (!data.years[y]) { if (!olustur) return []; data.years[y] = {}; }
    if (!data.years[y][m]) { if (!olustur) return []; data.years[y][m] = []; }
    return data.years[y][m];
  }
  const bul = id => kitaplar(yil, ay).find(b => b.id === id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const okunan = list => list.filter(b => b.status === 'done').length;
  const noktalar = n => Array.from({ length: HEDEF }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
  const titret = () => { if (navigator.vibrate) navigator.vibrate(8); };

  // ---------- Çizim ----------
  const $ = id => document.getElementById(id);

  function render(animasyon) {
    // Yıl
    $('yearLabel').textContent = yil;
    let toplam = 0;
    for (let m = 0; m < 12; m++) toplam += okunan(kitaplar(yil, m));
    const hedef = HEDEF * 12;
    $('yearsum').innerHTML =
      `<span><b>${toplam}</b>/${hedef} okundu</span>
       <div class="bar"><span style="width:${Math.min(100, toplam / hedef * 100)}%"></span></div>`;

    // Ay şeridi
    $('months').innerHTML = KISA.map((k, m) => {
      const n = okunan(kitaplar(yil, m));
      const cls = ['mchip', m === ay ? 'sel' : '', (yil === BU_YIL && m === BU_AY) ? 'now' : ''].join(' ');
      return `<button class="${cls}" data-act="month" data-m="${m}">${k}<span class="dots">${noktalar(n)}</span></button>`;
    }).join('');
    ortala();

    // Ay ekranı
    const list = kitaplar(yil, ay);
    const n = okunan(list);
    const icerik = list.length
      ? `<ul class="books">${list.map(kitapHTML).join('')}</ul>`
      : `<div class="empty"><div class="big">📚</div>Bu ay için henüz kitap yok.<br>Aşağıdaki butonla ekleyebilirsin.</div>`;
    $('view').innerHTML = `
      <div class="${animasyon ? 'fade' : ''}">
        <div class="m-title">
          <h1>${AYLAR[ay]}<small>${yil}</small></h1>
          <div class="goal${n >= HEDEF ? ' ok' : ''}"><span class="dots">${noktalar(n)}</span>${n}/${HEDEF}</div>
        </div>
        ${icerik}
      </div>`;
  }

  function kitapHTML(b) {
    return `
      <li class="book s-${b.status}" data-id="${b.id}">
        <div class="b-top">
          <div class="b-info">
            <div class="b-label">${DURUM[b.status]}</div>
            <div class="b-title">${esc(b.title)}</div>
            ${b.author ? `<div class="b-author">${esc(b.author)}</div>` : ''}
          </div>
          <button class="more" data-act="more" aria-label="Seçenekler">⋯</button>
        </div>
        <div class="b-actions">
          <button data-act="reading" class="${b.status === 'reading' ? 'on' : ''}">Okuyorum</button>
          <button data-act="done" class="${b.status === 'done' ? 'on' : ''}">Okudum</button>
        </div>
      </li>`;
  }

  let ilkOrtalama = true;
  function ortala() {
    const serit = $('months');
    const chip = serit.children[ay];
    if (!chip) return;
    const hedefX = chip.offsetLeft - serit.clientWidth / 2 + chip.offsetWidth / 2;
    serit.scrollTo({ left: hedefX, behavior: ilkOrtalama ? 'auto' : 'smooth' });
    ilkOrtalama = false;
  }

  function ayDegistir(fark) {
    ay += fark;
    if (ay < 0) { ay = 11; yil--; }
    if (ay > 11) { ay = 0; yil++; }
    render(true);
    window.scrollTo(0, 0);
  }

  // ---------- Alt sayfa ----------
  function sheetAc(html) {
    $('sheet').innerHTML = `<div class="grab"></div>${html}`;
    $('sheet').classList.add('open');
    $('backdrop').classList.add('open');
  }
  function sheetKapat() {
    $('sheet').classList.remove('open');
    $('backdrop').classList.remove('open');
    document.activeElement && document.activeElement.blur();
    seciliKitapId = null;
  }
  const sheetAcik = () => $('sheet').classList.contains('open');

  function formAc(kitap) {
    seciliKitapId = kitap ? kitap.id : null;
    sheetAc(`
      <h3>${kitap ? 'Kitabı düzenle' : 'Kitap ekle'}</h3>
      <p class="hint">${AYLAR[ay]} ${yil}</p>
      <form id="bookForm" autocomplete="off">
        <input name="baslik" placeholder="Kitap adı" value="${kitap ? esc(kitap.title) : ''}" enterkeyhint="next">
        <input name="yazar" placeholder="Yazar (isteğe bağlı)" value="${kitap ? esc(kitap.author || '') : ''}" enterkeyhint="done">
        <button type="submit" class="sbtn primary">${kitap ? 'Kaydet' : 'Ekle'}</button>
        <button type="button" class="sbtn plain" data-act="close">Vazgeç</button>
      </form>`);
    $("bookForm").baslik.focus();
  }

  function secenekAc(kitap) {
    seciliKitapId = kitap.id;
    sheetAc(`
      <h3>${esc(kitap.title)}</h3>
      <p class="hint">${kitap.author ? esc(kitap.author) + ' · ' : ''}${DURUM[kitap.status]}</p>
      <button class="sbtn" data-act="edit">Düzenle</button>
      ${kitap.status !== 'unread' ? `<button class="sbtn" data-act="reset">Okunmadı olarak işaretle</button>` : ''}
      <button class="sbtn danger" data-act="delete">Sil</button>
      <button class="sbtn plain" data-act="close">Vazgeç</button>`);
  }

  function menuAc() {
    sheetAc(`
      <h3>Yedekleme</h3>
      <p class="hint">Kitapların bu telefonda saklanır. Telefon değiştirirken ya da tedbir olarak yedek alabilirsin.</p>
      <button class="sbtn" data-act="export">Yedek al</button>
      <button class="sbtn" data-act="import">Yedekten yükle</button>
      <button class="sbtn plain" data-act="close">Kapat</button>`);
  }

  // ---------- Dokunma olayları ----------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    const kartEl = el.closest('.book');
    const kitap = kartEl ? bul(kartEl.dataset.id) : (seciliKitapId ? bul(seciliKitapId) : null);

    switch (act) {
      case 'prevYear': yil--; if (yil === BU_YIL) ay = BU_AY; render(true); break;
      case 'nextYear': yil++; if (yil === BU_YIL) ay = BU_AY; render(true); break;
      case 'month':    ay = Number(el.dataset.m); render(true); window.scrollTo(0, 0); break;
      case 'add':      formAc(null); break;
      case 'menu':     menuAc(); break;
      case 'close':    sheetKapat(); break;
      case 'more':     if (kitap) secenekAc(kitap); break;

      case 'reading':
      case 'done':
        if (!kitap) return;
        kitap.status = kitap.status === act ? 'unread' : act;
        titret(); save(); render();
        break;

      case 'edit':
        if (kitap) formAc(kitap);
        break;
      case 'reset':
        if (!kitap) return;
        kitap.status = 'unread';
        save(); sheetKapat(); render();
        break;
      case 'delete': {
        if (!kitap) return;
        if (!confirm(`"${kitap.title}" silinsin mi?`)) return;
        const list = kitaplar(yil, ay);
        list.splice(list.indexOf(kitap), 1);
        save(); sheetKapat(); render();
        break;
      }
      case 'export': yedekAl(); break;
      case 'import': $('importFile').click(); break;
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id !== 'bookForm') return;
    e.preventDefault();
    const f = e.target;
    const title = f.baslik.value.trim();
    const author = f.yazar.value.trim();
    if (!title) { f.baslik.focus(); return; }
    const mevcut = seciliKitapId && bul(seciliKitapId);
    if (mevcut) {
      mevcut.title = title;
      mevcut.author = author;
    } else {
      kitaplar(yil, ay, true).push({ id: uid(), title, author, status: 'unread' });
    }
    save(); sheetKapat(); render();
  });

  // Yazar alanında "ileri" tuşu: başlıktan yazara geç
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.name === "baslik") {
      e.preventDefault();
      e.target.form.yazar.focus();
    }
    if (e.key === 'Escape' && sheetAcik()) sheetKapat();
  });

  // Sağa / sola kaydırarak ay değiştir
  let tx = null, ty = null;
  $('view').addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  $('view').addEventListener('touchend', e => {
    if (tx === null || sheetAcik()) return;
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    tx = ty = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) ayDegistir(dx < 0 ? 1 : -1);
  }, { passive: true });

  // Klavye açılınca alt sayfayı klavyenin üstüne taşı
  if (window.visualViewport) {
    const ayarla = () => {
      const vv = window.visualViewport;
      const alt = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      $('sheet').style.bottom = alt + 'px';
    };
    visualViewport.addEventListener('resize', ayarla);
    visualViewport.addEventListener('scroll', ayarla);
  }

  // ---------- Yedekleme ----------
  async function yedekAl() {
    const ad = `cihan-okuyor-yedek-${new Date().toISOString().slice(0, 10)}.json`;
    const metin = JSON.stringify(data, null, 2);
    try {
      const dosya = new File([metin], ad, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [dosya] })) {
        await navigator.share({ files: [dosya], title: 'Cihan Okuyor yedeği' });
        return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([metin], { type: 'application/json' }));
    a.download = ad;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  $('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const d = JSON.parse(reader.result);
        if (!d || typeof d.years !== 'object') throw new Error();
        if (!confirm('Yedek yüklenecek ve şu anki liste değiştirilecek. Devam edilsin mi?')) return;
        data = d;
        save(); sheetKapat(); render(true);
      } catch (err) {
        alert('Bu dosya geçerli bir Cihan Okuyor yedeği değil.');
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  });

  // ---------- Başlat ----------
  render();

  // İnternetsiz de açılabilmesi için
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
